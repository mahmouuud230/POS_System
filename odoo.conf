[options]

; Database connection
db_host = postgres
db_port = 5432
db_user = odoo
db_password = OdooSaaS_Pg_2025!

; Multi-tenancy: bind each subdomain to its matching database name
; shop1.yourdomain.com → db_filter becomes ^shop1$ → only DB "shop1" is visible
db_filter = ^%d$
list_db = False

; Master password (plain text accepted; Odoo hashes it on first write)
admin_passwd = OdooMaster_2025!

; Proxy / network
proxy_mode = True
workers = 2
longpolling_port = 8072

; Performance
limit_memory_hard = 671088640
limit_memory_soft = 629145600
limit_time_cpu = 60
limit_time_real = 120
limit_time_real_cron = 0
max_cron_threads = 1

; Logging — value must be one bare word with no trailing text
log_level = warn
log_rotate_count = 5

; Paths
data_dir = /var/lib/odoo
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons

; Sessions stored in DB (safe for multi-worker)
session_db = True
