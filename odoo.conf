##############################################################################
# odoo.conf — Production config for Multi-Tenant SaaS
# Place at: ./odoo/odoo.conf  (mounted read-only into the container)
##############################################################################

[options]

# ── Database connection ───────────────────────────────────────────────────────
db_host     = postgres
db_port     = 5432
db_user     = odoo
db_password = REPLACE_WITH_ENV_VALUE   # overridden by the HOST/USER/PASSWORD
                                        # env vars set in docker-compose.yml

# ── Multi-tenancy isolation ───────────────────────────────────────────────────
# `^%d$` binds each virtual host to exactly one database whose name matches
# the subdomain.  shop1.yourdomain.com → DB "shop1", shop2 → "shop2", etc.
# The %d token is replaced by Odoo with the hostname (first label only).
db_filter   = ^%d$

# CRITICAL: disable the DB selector UI — users must never see other tenants
list_db     = False

# ── Security ──────────────────────────────────────────────────────────────────
# Admin master password (bcrypt hash recommended; generate with:
#   python3 -c "from passlib.context import CryptContext; \
#     print(CryptContext(['pbkdf2_sha512']).hash('YourMasterPassword'))"
admin_passwd = $pbkdf2-sha512$REPLACE_WITH_HASH

# ── Network / proxy ───────────────────────────────────────────────────────────
# Nginx Proxy Manager sits in front; trust its forwarded headers
proxy_mode  = True
# Workers: 0 = threaded mode (simpler for small VPS); raise for multi-core
workers     = 2
# Longpolling for bus / live-chat (only matters if workers > 0)
longpolling_port = 8072

# ── Performance ───────────────────────────────────────────────────────────────
# Per-worker memory limit in bytes (512 MB); worker restarts after limit
limit_memory_hard    = 671088640
limit_memory_soft    = 629145600
limit_time_cpu       = 60
limit_time_real      = 120
limit_time_real_cron = 0      # 0 = unlimited for cron
max_cron_threads     = 1

# ── Logging ───────────────────────────────────────────────────────────────────
logfile          = /var/log/odoo/odoo.log
log_level        = warn          # use "info" during initial setup, "warn" in prod
log_rotate_count = 5
log_rotate_size  = 10M

# ── Paths ─────────────────────────────────────────────────────────────────────
data_dir    = /var/lib/odoo
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons

# ── Sessions ──────────────────────────────────────────────────────────────────
# Store sessions in DB (not filesystem) for easier multi-worker sharing
session_db = True

# ── Email (configure per-tenant via Settings > Technical > Outgoing Mail) ────
# smtp_server = mail.example.com
# smtp_port   = 587
# smtp_ssl    = True
# smtp_user   = outgoing@example.com
# smtp_password = ...

##############################################################################
# How db_filter works (examples):
#   Hostname: shop1.yourdomain.com  →  %d = shop1  →  DB must be named "shop1"
#   Hostname: shop2.yourdomain.com  →  %d = shop2  →  DB must be named "shop2"
#
# If no DB matches, Odoo returns 404 — the tenant is fully invisible to others.
##############################################################################
